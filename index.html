<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teruna & Dara Wedding Invitation</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        /* --- VARIABLES & THEME (IVORY & SAGE GREEN) --- */
        :root {
            --bg-color: #F9F6F0; 
            --text-main: #3A4A3F; 
            --text-sub: #6B705C;
            --accent-rose: #B76E79; 
            --accent-gold: #C5A880;
            --card-bg: #FFFFFF;
            --shadow: 0 20px 50px rgba(0,0,0,0.1);
        }

        body.dark-mode {
            --bg-color: #1A1D1A; 
            --text-main: #E8E8E8;
            --text-sub: #A0A0A0;
            --card-bg: #232723;
            --shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Montserrat', sans-serif;
            overflow-x: hidden;
            transition: background-color 0.5s ease, color 0.5s ease;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding-top: 10px;
            scroll-behavior: smooth;
        }

        /* --- SPLASH SCREEN --- */
        #splash {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: var(--bg-color);
            z-index: 9999;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            transition: opacity 1s ease, visibility 1s ease;
        }
        #splash h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2rem; letter-spacing: 2px;
            color: var(--accent-rose);
            margin-bottom: 20px; text-align: center;
        }
        .btn-open {
            padding: 12px 30px; border: 1px solid var(--accent-rose);
            background: transparent; color: var(--accent-rose);
            font-size: 1rem; letter-spacing: 1px; cursor: pointer;
            border-radius: 30px; transition: all 0.3s;
            animation: pulse 2s infinite;
        }
        .btn-open:hover { background: var(--accent-rose); color: #fff; }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(183, 110, 121, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(183, 110, 121, 0); }
            100% { box-shadow: 0 0 0 0 rgba(183, 110, 121, 0); }
        }

        /* --- MAIN CONTENT --- */
        #main-content {
            opacity: 0; visibility: hidden;
            transition: opacity 1.5s ease;
            width: 100%; padding: 10px 15px;
            display: flex; flex-direction: column; align-items: center;
        }

        /* --- CONTROLS --- */
        .top-controls {
            position: fixed; top: 15px; right: 15px;
            display: flex; gap: 10px; z-index: 100;
        }
        .control-btn {
            background: var(--card-bg); border: 1px solid var(--accent-gold);
            color: var(--text-main); width: 40px; height: 40px; 
            border-radius: 50%; display: flex; justify-content: center; align-items: center;
            cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            font-size: 1.1rem; transition: all 0.3s;
        }
        .control-btn:hover { transform: scale(1.1); }

        /* --- 3D CARD SCENE --- */
        .scene {
            width: 100%; max-width: 320px; height: 480px;    
            perspective: 1200px; margin-top: 50px; margin-bottom: 30px; z-index: 10;
        }
        .card-container {
            width: 100%; height: 100%; position: relative;
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-style: preserve-3d; cursor: pointer;
        }
        .card-container.flipped { transform: rotateY(180deg); }
        .card-face {
            position: absolute; width: 100%; height: 100%;
            backface-visibility: hidden; border-radius: 12px;
            box-shadow: var(--shadow); background-size: cover;
            background-position: center; background-repeat: no-repeat;
            border: 5px solid var(--card-bg);
        }
        /* Tukar nama fail gambar mengikut gambar awak */
        .card-front { background-image: url('teruna-depan.jpg'); }
        .card-back { background-image: url('teruna-belakang.jpg'); transform: rotateY(180deg); }

        /* --- TEXT & BUTTONS SECTION --- */
        .info-section {
            text-align: center; max-width: 350px;
            margin-bottom: 50px; padding-top: 20px;
        }
        .parents-text {
            font-size: 0.8rem; color: var(--text-sub); margin-bottom: 10px;
        }
        .names {
            font-family: 'Great Vibes', cursive;
            font-size: 2.5rem; color: var(--accent-rose);
            margin-bottom: 5px; line-height: 1.1;
        }
        
        .date-container {
            display: flex; flex-direction: column; align-items: center;
            margin-bottom: 25px;
        }
        .day-text {
            font-family: 'Great Vibes', cursive;
            font-size: 2rem; color: var(--accent-rose); margin-bottom: -5px;
        }
        .date-text {
            font-family: 'Playfair Display', serif;
            font-size: 0.95rem; font-weight: 600;
            letter-spacing: 2px; text-transform: uppercase; color: var(--text-main);
        }
        .time-text {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.85rem; font-weight: 500;
            letter-spacing: 2px; color: var(--text-sub); margin-top: 5px;
        }

        /* --- COUNTDOWN --- */
        .countdown-container {
            display: flex; justify-content: center; gap: 8px; margin-bottom: 25px;
        }
        .countdown-box {
            background: var(--card-bg); padding: 8px 10px;
            border-radius: 8px; border: 1px solid var(--accent-gold); min-width: 60px; 
        }
        .countdown-box span {
            display: block; font-size: 1.3rem; font-weight: 600; color: var(--accent-rose);
        }
        .countdown-box small {
            font-size: 0.6rem; text-transform: uppercase;
            letter-spacing: 1px; color: var(--text-sub);
        }

        /* --- ACTION BUTTONS --- */
        .action-buttons { display: flex; flex-direction: column; gap: 12px; width: 100%; }
        .btn-action {
            display: flex; align-items: center; justify-content: center; gap: 10px;
            padding: 14px; border-radius: 30px; text-decoration: none;
            font-weight: 500; font-size: 0.85rem; letter-spacing: 1px;
            transition: all 0.3s; border: none; cursor: pointer;
        }
        .btn-rsvp { background-color: var(--accent-rose); color: #fff; }
        .btn-maps, .btn-calendar { background-color: transparent; border: 1px solid var(--accent-gold); color: var(--text-main); }
        .btn-action:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(0,0,0,0.15); }

        /* --- BACKGROUND PARTICLES --- */
        #particles-js {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1; pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="splash">
        <h1>Teruna & Dara</h1>
        <p style="margin-bottom: 30px; font-size: 0.9rem; letter-spacing: 2px;">29 . 02 . 2027</p>
        <button class="btn-open" onclick="openInvitation()">Tap to Open 💌</button>
    </div>

    <div id="particles-js"></div>

    <div id="main-content">
        <div class="top-controls">
            <button class="control-btn" id="audioBtn" onclick="toggleAudio()" title="Play Music">🎵</button>
            <button class="control-btn" onclick="toggleTheme()" title="Toggle Theme">🌙</button>
        </div>

        <div class="scene" id="scene">
            <div class="card-container" id="card" onclick="flipCard()">
                <div class="card-face card-front"></div>
                <div class="card-face card-back"></div>
            </div>
        </div>

        <div class="info-section" id="details">
            <!-- Teks ibu bapa pengantin -->
            <div class="parents-text">
                Together with their families<br>
                <b>Pak Pandir & Mak Andeh</b><br>
                (Parents of the Groom)<br><br>
                <b>Pak Oteh & Mak Oteh</b><br>
                (Parents of the Bride)
            </div>

            <div class="names">
                Teruna <br>&<br> Dara
            </div>
            
            <!-- Tarikh: 29 Feb 2027 (Monday) -->
            <div class="date-container">
                <div class="day-text">Monday</div>
                <div class="date-text">29 February 2027</div>
                <div class="time-text">12:00 PM - 12:00 AM</div>
            </div>

            <div class="countdown-container" id="countdown">
                <div class="countdown-box"><span id="days">00</span><small>Days</small></div>
                <div class="countdown-box"><span id="hours">00</span><small>Hours</small></div>
                <div class="countdown-box"><span id="mins">00</span><small>Mins</small></div>
                <div class="countdown-box"><span id="secs">00</span><small>Secs</small></div>
            </div>

            <div class="action-buttons">
                <!-- Butang RSVP dummy -->
                <a href="#" target="_blank" class="btn-action btn-rsvp">
                    💬 RSVP via WhatsApp
                </a>
                <!-- Butang Maps dummy -->
                <a href="#" target="_blank" class="btn-action btn-maps">
                    📍 View Location
                </a>
                <button onclick="downloadICS()" class="btn-action btn-calendar">
                    📅 Add to Calendar
                </button>
            </div>
        </div>
    </div>

    <script>
        let audioCtx, isAudioPlaying = false, loopInterval;
        let autoScrollActive = false, scrollSpeed = 0.8; 

        function openInvitation() {
            document.getElementById('splash').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('splash').style.display = 'none';
                document.getElementById('main-content').style.opacity = '1';
                document.getElementById('main-content').style.visibility = 'visible';
                initParticles();
                playLoopAudio();
                setTimeout(startAutoScroll, 2000);
            }, 800);
        }

        function startAutoScroll() {
            autoScrollActive = true;
            let scrollPos = window.scrollY;
            function scrollStep() {
                if (!autoScrollActive) return;
                scrollPos += scrollSpeed;
                window.scrollTo(0, scrollPos);
                if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 10) {
                    autoScrollActive = false; return;
                }
                requestAnimationFrame(scrollStep);
            }
            requestAnimationFrame(scrollStep);
        }

        ['mousedown', 'wheel', 'touchstart'].forEach(evt => {
            window.addEventListener(evt, () => { autoScrollActive = false; }, { passive: true });
        });

        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
            const btn = document.querySelectorAll('.control-btn')[1];
            btn.innerHTML = document.body.classList.contains('dark-mode') ? '☀️' : '🌙';
        }

        const card = document.getElementById('card');
        let isFlipped = false;
        function flipCard() {
            isFlipped = !isFlipped;
            if(isFlipped) card.classList.add('flipped');
            else card.classList.remove('flipped');
        }

        document.getElementById('scene').addEventListener('mousemove', (e) => {
            if(isFlipped) return;
            const xAxis = (window.innerWidth / 2 - e.pageX) / 25;
            const yAxis = (window.innerHeight / 2 - e.pageY) / 25;
            card.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
        });

        document.getElementById('scene').addEventListener('mouseleave', () => {
            if(isFlipped) return;
            card.style.transform = `rotateY(0deg) rotateX(0deg)`;
            card.style.transition = 'transform 0.5s ease';
            setTimeout(() => card.style.transition = 'transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275)', 500);
        });

        // --- COUNTDOWN (Ubah Tarikh Di Sini) ---
        const targetDate = new Date("February 29, 2027 12:00:00").getTime();
        setInterval(() => {
            const now = new Date().getTime();
            const distance = targetDate - now;
            // Nota: 2027 tiada 29 Feb, jadi timer ni mungkin akan tunjuk minus nanti.
            // Untuk test, tukar ke tahun 2028 (tahun lompat).
            if (distance < 0) return; 

            document.getElementById("days").innerText = Math.floor(distance / (1000 * 60 * 60 * 24)).toString().padStart(2, '0');
            document.getElementById("hours").innerText = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)).toString().padStart(2, '0');
            document.getElementById("mins").innerText = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60)).toString().padStart(2, '0');
            document.getElementById("secs").innerText = Math.floor((distance % (1000 * 60)) / 1000).toString().padStart(2, '0');
        }, 1000);

        // --- MUZIK (Kekal sama) ---
        function playLoopAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            isAudioPlaying = true;
            document.getElementById('audioBtn').innerHTML = '🔊';

            const masterGain = audioCtx.createGain();
            masterGain.connect(audioCtx.destination);
            masterGain.gain.setValueAtTime(0.2, audioCtx.currentTime); 

            const notesD = [293.66, 369.99, 440.00, 587.33];
            const notesA = [220.00, 277.18, 329.63, 440.00];
            const notesBm = [246.94, 293.66, 369.99, 493.88];
            const notesG = [196.00, 246.94, 293.66, 392.00];

            let loopStep = 0;
            function playNextSequence() {
                if (!isAudioPlaying) return;
                let time = audioCtx.currentTime;
                let seq1 = (loopStep % 2 === 0) ? notesD : notesA;
                let seq2 = (loopStep % 2 === 0) ? notesBm : notesG;
                seq1.forEach(freq => { playTone(freq, time, 1.2, masterGain); time += 0.3; });
                seq2.forEach(freq => { playTone(freq, time, 1.2, masterGain); time += 0.3; });
                loopStep++;
            }
            playNextSequence(); 
            loopInterval = setInterval(playNextSequence, 2400); 
        }

        function playTone(freq, startTime, duration, masterGain) {
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.type = 'triangle'; 
            osc.frequency.setValueAtTime(freq, startTime);
            gainNode.gain.setValueAtTime(0, startTime);
            gainNode.gain.linearRampToValueAtTime(0.6, startTime + 0.02);
            gainNode.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
            osc.connect(gainNode);
            gainNode.connect(masterGain);
            osc.start(startTime);
            osc.stop(startTime + duration);
        }

        function toggleAudio() {
            if (isAudioPlaying) {
                clearInterval(loopInterval); audioCtx.suspend();
                isAudioPlaying = false; document.getElementById('audioBtn').innerHTML = '🔇';
            } else {
                if (audioCtx && audioCtx.state === 'suspended') {
                    audioCtx.resume(); isAudioPlaying = true;
                    document.getElementById('audioBtn').innerHTML = '🔊';
                    playLoopAudio();
                } else { playLoopAudio(); }
            }
        }

        function downloadICS() {
            const icsContent = `BEGIN:VCALENDAR\nVERSION:2.0\nPRODID:-//Teruna&Dara//EN\nBEGIN:VEVENT\nUID:${new Date().getTime()}@wedding.com\nDTSTAMP:${new Date().toISOString().replace(/[-:]/g, '').split('.')[0]}Z\nDTSTART:20270229T120000Z\nDTEND:20270301T000000Z\nSUMMARY:Wedding of Teruna & Dara\nLOCATION:The Fairy Tale Hall, Singapore\nDESCRIPTION:This is a dummy event for testing purposes.\nEND:VEVENT\nEND:VCALENDAR`;
            const blob = new Blob([icsContent], { type: 'text/calendar;charset=utf-8' });
            const link = document.createElement('a');
            link.href = window.URL.createObjectURL(blob);
            link.download = 'Teruna_Dara_Wedding.ics';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function initParticles() {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            document.getElementById('particles-js').appendChild(canvas);
            let width, height, petals = [];
            function resize() { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; }
            window.addEventListener('resize', resize); resize();

            class Petal {
                constructor() {
                    this.x = Math.random() * width; this.y = Math.random() * height - height;
                    this.size = Math.random() * 5 + 5; this.speedY = Math.random() * 1.5 + 0.5; 
                    this.opacity = Math.random() * 0.5 + 0.3; this.angle = Math.random() * Math.PI * 2;
                }
                update() {
                    this.y += this.speedY; this.x += Math.sin(this.angle) * 0.8; this.angle += 0.02;
                    if (this.y > height) { this.y = -10; this.x = Math.random() * width; }
                }
                draw() {
                    ctx.save(); ctx.translate(this.x, this.y); ctx.rotate(this.angle); ctx.beginPath();
                    ctx.ellipse(0, 0, this.size, this.size / 2, 0, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(183, 110, 121, ${this.opacity})`; ctx.fill(); ctx.restore();
                }
            }
            for (let i = 0; i < 50; i++) petals.push(new Petal());
            function animate() {
                ctx.clearRect(0, 0, width, height);
                petals.forEach(p => { p.update(); p.draw(); });
                requestAnimationFrame(animate);
            }
            animate();
        }
    </script>
</body>
</html>
